<body>
<div id="root"></div>
<script>
// Chrome fires beforeinstallprompt as soon as the page qualifies — often before the
// React bundle has parsed, let alone mounted. Stash it here so InstallApp can pick it
// up whenever it mounts, and re-broadcast so an already-mounted component reacts too.
(function () {
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    window.__meaadInstallPrompt = e;
    window.dispatchEvent(new CustomEvent('meaad:installable'));
  });
  window.addEventListener('appinstalled', function () {
    window.__meaadInstallPrompt = null;
  });
})();
</script>
