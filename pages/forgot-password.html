<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>استعادة كلمة السر — ميعاد</title>
<link rel="stylesheet" href="../_ds/meaad-design-system-54b82ae0-23b3-4f03-a001-0d94ca67e9ba/tokens/fonts.css">
<link rel="stylesheet" href="../_ds/meaad-design-system-54b82ae0-23b3-4f03-a001-0d94ca67e9ba/tokens/colors.css">
<link rel="stylesheet" href="../_ds/meaad-design-system-54b82ae0-23b3-4f03-a001-0d94ca67e9ba/tokens/typography.css">
<link rel="stylesheet" href="../_ds/meaad-design-system-54b82ae0-23b3-4f03-a001-0d94ca67e9ba/tokens/spacing.css">
<link rel="stylesheet" href="../_ds/meaad-design-system-54b82ae0-23b3-4f03-a001-0d94ca67e9ba/tokens/shadows.css">
<link rel="stylesheet" href="../_ds/meaad-design-system-54b82ae0-23b3-4f03-a001-0d94ca67e9ba/styles.css">
<style>
  html,body{margin:0;height:100%}
  body{background:var(--surface-page);font-family:var(--font-body);color:var(--text-body);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
  a{color:var(--text-link);text-decoration:none}
  a:hover{color:var(--teal-700)}
  ::selection{background:var(--teal-200)}
  .otp-input{width:56px;height:60px;text-align:center;font-size:24px;border-radius:14px;border:1.5px solid var(--border-default);font-family:var(--font-display);font-weight:800;color:var(--text-strong);outline:none;transition:border-color .15s ease, box-shadow .15s ease}
  .otp-input:focus{border-color:var(--brand);box-shadow:var(--shadow-focus)}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script src="../_ds/meaad-design-system-54b82ae0-23b3-4f03-a001-0d94ca67e9ba/_ds_bundle.js"></script>

<script type="text/babel">
const { Icon, Button, Field, Input, Alert } = window.MeaadDesignSystem_54b82a;
const font = 'var(--font-display)';

const CHANNELS = [
  { id: 'wa', label: 'WhatsApp', icon: 'message-circle', color: 'var(--whatsapp)', hint: 'إلى رقم هاتفك المسجّل' },
  { id: 'sms', label: 'رسالة SMS', icon: 'message-square', color: 'var(--blue-500)', hint: 'إلى رقم هاتفك المسجّل' },
  { id: 'email', label: 'البريد الإلكتروني', icon: 'mail', color: 'var(--gray-500)', hint: 'إلى بريدك المسجّل' },
];

function Shell({ children }) {
  return (
    <div style={{ width: '100%', maxWidth: 440, background: '#fff', borderRadius: 26, border: '1px solid var(--border-subtle)', boxShadow: 'var(--shadow-lg)', padding: '34px 32px' }}>
      {children}
    </div>
  );
}

function Progress({ step }) {
  return (
    <div style={{ display: 'flex', gap: 6, marginBottom: 26 }}>
      {[0, 1, 2, 3].map(i => (
        <div key={i} style={{ height: 4, flex: 1, borderRadius: 4, background: i <= step ? 'var(--brand)' : 'var(--surface-sunken)', transition: 'background .2s' }} />
      ))}
    </div>
  );
}

function StepIcon({ icon, tone = 'var(--brand)' }) {
  return (
    <div style={{ width: 60, height: 60, borderRadius: 18, background: `color-mix(in srgb, ${tone} 12%, white)`, color: tone, display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 18px' }}>
      <Icon name={icon} size={28} />
    </div>
  );
}

function BackLink({ onClick }) {
  return (
    <button onClick={onClick} style={{ display: 'flex', alignItems: 'center', gap: 6, background: 'none', border: 'none', cursor: 'pointer', color: 'var(--text-muted)', fontSize: 13.5, fontWeight: 700, padding: 0, marginBottom: 18 }}>
      <Icon name="chevron-right" size={16} />رجوع
    </button>
  );
}

function RequestStep({ onNext }) {
  const [channel, setChannel] = React.useState('wa');
  const [dest, setDest] = React.useState('');
  const active = CHANNELS.find(c => c.id === channel);
  return (
    <div style={{ textAlign: 'center' }}>
      <StepIcon icon="key-round" />
      <h1 style={{ fontFamily: font, fontWeight: 900, fontSize: 22, color: 'var(--text-strong)', margin: 0 }}>استعادة كلمة السر</h1>
      <p style={{ color: 'var(--text-muted)', fontSize: 14, lineHeight: 1.75, marginTop: 8 }}>اختر الطريقة التي تفضّل استلام رمز التحقق من خلالها.</p>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginTop: 24, textAlign: 'start' }}>
        {CHANNELS.map(c => {
          const on = channel === c.id;
          return (
            <button key={c.id} onClick={() => setChannel(c.id)} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: 14, borderRadius: 15, cursor: 'pointer', textAlign: 'start', background: on ? 'var(--brand-subtle)' : '#fff', border: on ? '1.5px solid var(--brand-border)' : '1.5px solid var(--border-subtle)' }}>
              <span style={{ width: 38, height: 38, borderRadius: 11, flex: '0 0 auto', background: `color-mix(in srgb, ${c.color} 14%, white)`, color: c.color, display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Icon name={c.icon} size={19} /></span>
              <span>
                <div style={{ fontFamily: font, fontWeight: 800, fontSize: 14.5, color: 'var(--text-strong)' }}>{c.label}</div>
                <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>{c.hint}</div>
              </span>
              <span style={{ marginInlineStart: 'auto', width: 22, height: 22, borderRadius: '50%', flex: '0 0 auto', display: 'flex', alignItems: 'center', justifyContent: 'center', border: on ? 'none' : '2px solid var(--border-default)', background: on ? 'var(--brand)' : 'transparent' }}>
                {on && <Icon name="check" size={13} color="#fff" stroke={3} />}
              </span>
            </button>
          );
        })}
      </div>

      <div style={{ marginTop: 20, textAlign: 'start' }}>
        <Field label={channel === 'email' ? 'البريد الإلكتروني' : 'رقم الهاتف'}>
          <Input iconStart={channel === 'email' ? 'mail' : 'phone'} placeholder={channel === 'email' ? 'example@meaad.sa' : '01xx xxx xxxx'} value={dest} onChange={e => setDest(e.target.value)} />
        </Field>
      </div>

      <Button block size="lg" iconEnd="send" style={{ marginTop: 20 }} onClick={() => onNext(active)}>إرسال رمز التحقق</Button>
      <div style={{ marginTop: 20, fontSize: 13.5 }}>
        تذكرت كلمة السر؟ <a href="login.html">تسجيل الدخول</a>
      </div>
    </div>
  );
}

function OtpBoxes({ value, onChange }) {
  const refs = React.useRef([]);
  const set = (i, v) => {
    if (!/^[0-9]?$/.test(v)) return;
    const next = value.split(''); next[i] = v; onChange(next.join(''));
    if (v && refs.current[i + 1]) refs.current[i + 1].focus();
  };
  const onKeyDown = (i, e) => {
    if (e.key === 'Backspace' && !value[i] && refs.current[i - 1]) refs.current[i - 1].focus();
  };
  return (
    <div dir="ltr" style={{ display: 'flex', gap: 10, justifyContent: 'center' }}>
      {[0, 1, 2, 3].map(i => (
        <input key={i} ref={el => refs.current[i] = el} className="otp-input" inputMode="numeric" maxLength={1}
          value={value[i] || ''} onChange={e => set(i, e.target.value)} onKeyDown={e => onKeyDown(i, e)} />
      ))}
    </div>
  );
}

function OtpStep({ channel, onNext, onBack }) {
  const [code, setCode] = React.useState('');
  const [seconds, setSeconds] = React.useState(45);
  React.useEffect(() => {
    if (seconds <= 0) return;
    const t = setTimeout(() => setSeconds(s => s - 1), 1000);
    return () => clearTimeout(t);
  }, [seconds]);
  const mm = String(Math.floor(seconds / 60)).padStart(1, '0');
  const ss = String(seconds % 60).padStart(2, '0');
  return (
    <div style={{ textAlign: 'center' }}>
      <BackLink onClick={onBack} />
      <StepIcon icon={channel.icon} tone={channel.color} />
      <h1 style={{ fontFamily: font, fontWeight: 900, fontSize: 22, color: 'var(--text-strong)', margin: 0 }}>أدخل رمز التحقق</h1>
      <p style={{ color: 'var(--text-muted)', fontSize: 14, lineHeight: 1.75, marginTop: 8 }}>أرسلنا رمزاً مكوّناً من 4 أرقام عبر {channel.label} إلى ••• 4567</p>

      <div style={{ marginTop: 24 }}><OtpBoxes value={code} onChange={setCode} /></div>

      <div style={{ marginTop: 18, fontSize: 13.5, color: 'var(--text-muted)' }}>
        {seconds > 0
          ? <span>إعادة إرسال الرمز خلال <b style={{ color: 'var(--text-strong)', fontFamily: font }}>{mm}:{ss}</b></span>
          : <button onClick={() => setSeconds(45)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--text-link)', fontWeight: 700, fontSize: 13.5 }}>إعادة إرسال الرمز</button>}
      </div>

      <Button block size="lg" disabled={code.length < 4} style={{ marginTop: 22 }} onClick={onNext}>تأكيد ومتابعة</Button>
    </div>
  );
}

function Strength({ value }) {
  const level = value.length === 0 ? 0 : value.length < 6 ? 1 : value.length < 10 ? 2 : 3;
  const meta = [
    { label: '', color: 'var(--border-subtle)' },
    { label: 'ضعيفة', color: 'var(--red-500)' },
    { label: 'متوسطة', color: 'var(--amber-500)' },
    { label: 'قوية', color: 'var(--green-500)' },
  ][level];
  return (
    <div style={{ marginTop: 8 }}>
      <div style={{ display: 'flex', gap: 5 }}>
        {[1, 2, 3].map(i => <div key={i} style={{ height: 5, flex: 1, borderRadius: 4, background: i <= level ? meta.color : 'var(--surface-sunken)' }} />)}
      </div>
      {value.length > 0 && <div style={{ fontSize: 11.5, color: meta.color, fontWeight: 700, marginTop: 5 }}>قوة كلمة السر: {meta.label}</div>}
    </div>
  );
}

function PasswordInput({ value, onChange, placeholder }) {
  const [show, setShow] = React.useState(false);
  const [focus, setFocus] = React.useState(false);
  return (
    <div style={{ position: 'relative', display: 'flex', alignItems: 'center' }}>
      <span style={{ position: 'absolute', insetInlineStart: 14, color: 'var(--text-muted)', display: 'flex' }}><Icon name="lock" size={18} /></span>
      <input
        type={show ? 'text' : 'password'} value={value} placeholder={placeholder}
        onChange={e => onChange(e.target.value)} onFocus={() => setFocus(true)} onBlur={() => setFocus(false)}
        style={{ width: '100%', height: 46, fontFamily: 'var(--font-body)', fontSize: 'var(--text-base)', color: 'var(--text-strong)', background: '#fff', border: `1px solid ${focus ? 'var(--brand)' : 'var(--border-default)'}`, borderRadius: 'var(--radius-md)', padding: '0 44px', boxShadow: focus ? 'var(--shadow-focus)' : 'none', outline: 'none', boxSizing: 'border-box', transition: 'border-color .15s ease, box-shadow .15s ease' }}
      />
      <button type="button" onClick={() => setShow(s => !s)} style={{ position: 'absolute', insetInlineEnd: 14, background: 'none', border: 'none', cursor: 'pointer', color: 'var(--text-muted)', display: 'flex' }}>
        <Icon name={show ? 'eye-off' : 'eye'} size={18} />
      </button>
    </div>
  );
}

function NewPasswordStep({ onNext, onBack }) {
  const [pw, setPw] = React.useState('');
  const [pw2, setPw2] = React.useState('');
  const mismatch = pw2.length > 0 && pw !== pw2;
  return (
    <div style={{ textAlign: 'center' }}>
      <BackLink onClick={onBack} />
      <StepIcon icon="key-round" />
      <h1 style={{ fontFamily: font, fontWeight: 900, fontSize: 22, color: 'var(--text-strong)', margin: 0 }}>إنشاء كلمة سر جديدة</h1>
      <p style={{ color: 'var(--text-muted)', fontSize: 14, lineHeight: 1.75, marginTop: 8 }}>اختر كلمة سر قوية لحسابك، لم تستخدمها من قبل.</p>

      <div style={{ marginTop: 22, textAlign: 'start', display: 'flex', flexDirection: 'column', gap: 16 }}>
        <div>
          <Field label="كلمة السر الجديدة"><PasswordInput value={pw} onChange={setPw} placeholder="••••••••" /></Field>
          <Strength value={pw} />
        </div>
        <Field label="تأكيد كلمة السر الجديدة"><PasswordInput value={pw2} onChange={setPw2} placeholder="••••••••" /></Field>
        {mismatch && <Alert tone="danger">كلمتا السر غير متطابقتين.</Alert>}
      </div>

      <Button block size="lg" disabled={!pw || !pw2 || mismatch} style={{ marginTop: 22 }} onClick={onNext}>حفظ كلمة السر</Button>
    </div>
  );
}

function SuccessStep() {
  return (
    <div style={{ textAlign: 'center' }}>
      <div style={{ width: 70, height: 70, borderRadius: '50%', background: 'var(--green-50)', color: 'var(--green-500)', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 18px' }}>
        <Icon name="check-check" size={34} />
      </div>
      <h1 style={{ fontFamily: font, fontWeight: 900, fontSize: 22, color: 'var(--text-strong)', margin: 0 }}>تم تغيير كلمة السر بنجاح</h1>
      <p style={{ color: 'var(--text-muted)', fontSize: 14, lineHeight: 1.75, marginTop: 8 }}>يمكنك الآن تسجيل الدخول بكلمة السر الجديدة.</p>
      <Button block size="lg" style={{ marginTop: 24 }} onClick={() => location.href = 'login.html'}>تسجيل الدخول الآن</Button>
    </div>
  );
}

function App() {
  const [step, setStep] = React.useState(0);
  const [channel, setChannel] = React.useState(CHANNELS[0]);
  return (
    <Shell>
      <Progress step={step} />
      {step === 0 && <RequestStep onNext={c => { setChannel(c); setStep(1); }} />}
      {step === 1 && <OtpStep channel={channel} onBack={() => setStep(0)} onNext={() => setStep(2)} />}
      {step === 2 && <NewPasswordStep onBack={() => setStep(1)} onNext={() => setStep(3)} />}
      {step === 3 && <SuccessStep />}
    </Shell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
