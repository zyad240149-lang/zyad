<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إنشاء حساب — ميعاد</title>
<link rel="stylesheet" href="../_ds/meaad-design-system-54b82ae0-23b3-4f03-a001-0d94ca67e9ba/tokens/fonts.css">
<link rel="stylesheet" href="../_ds/meaad-design-system-54b82ae0-23b3-4f03-a001-0d94ca67e9ba/tokens/colors.css">
<link rel="stylesheet" href="../_ds/meaad-design-system-54b82ae0-23b3-4f03-a001-0d94ca67e9ba/tokens/typography.css">
<link rel="stylesheet" href="../_ds/meaad-design-system-54b82ae0-23b3-4f03-a001-0d94ca67e9ba/tokens/spacing.css">
<link rel="stylesheet" href="../_ds/meaad-design-system-54b82ae0-23b3-4f03-a001-0d94ca67e9ba/tokens/shadows.css">
<link rel="stylesheet" href="../_ds/meaad-design-system-54b82ae0-23b3-4f03-a001-0d94ca67e9ba/styles.css">
<style>
  html,body{margin:0;height:100%}
  body{background:var(--surface-page);font-family:var(--font-body);color:var(--text-body);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
  a{color:var(--text-link);text-decoration:none}
  a:hover{color:var(--teal-700)}
  ::selection{background:var(--teal-200)}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script src="../_ds/meaad-design-system-54b82ae0-23b3-4f03-a001-0d94ca67e9ba/_ds_bundle.js"></script>

<script type="text/babel">
const { Icon, Button, Field, Input, Checkbox } = window.MeaadDesignSystem_54b82a;
const font = 'var(--font-display)';

function PasswordField({ label, value, onChange, placeholder, hint }) {
  const [show, setShow] = React.useState(false);
  const [focus, setFocus] = React.useState(false);
  return (
    <Field label={label} hint={hint}>
      <div style={{ position: 'relative', display: 'flex', alignItems: 'center' }}>
        <span style={{ position: 'absolute', insetInlineStart: 14, color: 'var(--text-muted)', display: 'flex' }}><Icon name="lock" size={18} /></span>
        <input
          type={show ? 'text' : 'password'}
          value={value}
          onChange={e => onChange(e.target.value)}
          placeholder={placeholder}
          onFocus={() => setFocus(true)}
          onBlur={() => setFocus(false)}
          style={{ width: '100%', height: 46, fontFamily: 'var(--font-body)', fontSize: 'var(--text-base)', color: 'var(--text-strong)', background: '#fff', border: `1px solid ${focus ? 'var(--brand)' : 'var(--border-default)'}`, borderRadius: 'var(--radius-md)', padding: '0 44px', boxShadow: focus ? 'var(--shadow-focus)' : 'none', outline: 'none', transition: 'border-color .15s ease, box-shadow .15s ease', boxSizing: 'border-box' }}
        />
        <button type="button" onClick={() => setShow(s => !s)} aria-label="إظهار كلمة السر" style={{ position: 'absolute', insetInlineEnd: 14, background: 'none', border: 'none', cursor: 'pointer', color: 'var(--text-muted)', display: 'flex' }}>
          <Icon name={show ? 'eye-off' : 'eye'} size={18} />
        </button>
      </div>
    </Field>
  );
}

function SignupForm() {
  const [name, setName] = React.useState('');
  const [phone, setPhone] = React.useState('');
  const [pw, setPw] = React.useState('');
  const [agree, setAgree] = React.useState(false);
  const canSubmit = name && phone && pw.length >= 8 && agree;

  return (
    <div style={{ width: '100%', maxWidth: 440, background: '#fff', borderRadius: 26, border: '1px solid var(--border-subtle)', boxShadow: 'var(--shadow-lg)', padding: '34px 32px' }}>
      <a href="landing.html" style={{ display: 'inline-flex', alignItems: 'center', gap: 8, fontSize: 13.5, fontWeight: 700, color: 'var(--text-muted)', marginBottom: 22 }}>
        <Icon name="arrow-right" size={16} />العودة للرئيسية
      </a>

      <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 18 }}>
        <div style={{ width: 38, height: 38, borderRadius: 12, background: 'var(--brand)', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: font, fontWeight: 900, fontSize: 18, boxShadow: 'var(--shadow-brand)' }}>م</div>
        <span style={{ fontFamily: font, fontWeight: 900, fontSize: 18, color: 'var(--text-strong)' }}>ميعاد</span>
      </div>

      <h1 style={{ fontFamily: font, fontWeight: 900, fontSize: 25, color: 'var(--text-strong)', margin: 0 }}>إنشاء حساب</h1>
      <p style={{ color: 'var(--text-muted)', fontSize: 14, marginTop: 6 }}>معلومات بسيطة وتكون جاهز لحجز موعدك.</p>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 16, marginTop: 24 }}>
        <Field label="الاسم بالكامل">
          <Input iconStart="user-round" placeholder="مثال: أحمد سامي" value={name} onChange={e => setName(e.target.value)} />
        </Field>

        <Field label="رقم الهاتف">
          <Input iconStart="phone" placeholder="+20 1xx xxx xxxx" value={phone} onChange={e => setPhone(e.target.value)} />
        </Field>

        <PasswordField label="كلمة المرور" value={pw} onChange={setPw} placeholder="••••••••" hint="استخدم 8 أحرف على الأقل مع الأرقام" />

        <Checkbox
          checked={agree}
          onChange={setAgree}
          label={<span>أوافق على <a href="#">الشروط</a> و<a href="#">سياسة الخصوصية</a></span>}
        />

        <Button block size="lg" disabled={!canSubmit}>أنشئ الحساب</Button>

        <div style={{ textAlign: 'center', fontSize: 13.5 }}>
          عندك حساب بالفعل؟ <a href="login.html">سجّل الدخول</a>
        </div>
      </div>

      <div style={{ textAlign: 'center', marginTop: 26, fontSize: 12, color: 'var(--text-muted)' }}>
        © 2026 ميعاد · <a href="#">الشروط</a> · <a href="#">الخصوصية</a>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<SignupForm />);
</script>
</body>
</html>
